[package]
name = "libre-jevlike-rs"
version = "0.1.0"
edition = "2021"
description = "Direct option-logit scorer using llama.cpp"
license = "MIT"
publish = false

[features]
default = ["vulkan"]
# Vulkan is a linux-only optional dependency so this feature does not turn Vulkan on in macOS builds.
vulkan = ["dep:llama-cpp-sys-2", "llama-cpp-sys-2/vulkan"]
cpu = []

[dependencies]
hex = "=0.4.3"
hf-hub = { version = "=1.0.0", features = ["blocking"] }
minijinja = { version = "=2.24.0", features = ["json", "serde"] }
minijinja-contrib = { version = "=2.24.0", features = ["pycompat"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sha2 = "=0.11.0"
thiserror = "=2.0.21"
tokenizers = "=0.23.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Metal only. Default features pull OpenMP, which is unnecessary when every layer is offloaded.
llama-cpp-2 = { version = "=0.1.157", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
# OpenMP for CPU work. Vulkan comes from the vulkan feature, not from this dependency.
llama-cpp-2 = { version = "=0.1.157", default-features = false, features = ["openmp"] }
llama-cpp-sys-2 = { version = "=0.1.157", default-features = false, optional = true }
